name: DAGBO News and Spike Monitor

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/dagbo-news-monitor.yml"
      - "api/news-monitor.js"
      - "lib/news-monitor.js"
      - "lib/fcs-calendar.js"

permissions:
  contents: read

concurrency:
  group: dagbo-news-monitor
  cancel-in-progress: false

jobs:
  notify:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Run five-minute news monitor
        env:
          DAGBO_BASE_URL: https://dagboboss.vercel.app
          DAGBO_CRON_SECRET: ${{ secrets.DAGBO_CRON_SECRET }}
        run: |
          if [ -z "$DAGBO_CRON_SECRET" ]; then
            echo "::error::Missing repository secret DAGBO_CRON_SECRET"
            exit 1
          fi
          response=$(curl --fail-with-body --silent --show-error --retry 2 --retry-delay 5 --max-time 120 \
            --request POST \
            -H "Authorization: Bearer $DAGBO_CRON_SECRET" \
            -H "Content-Type: application/json" \
            --data '{}' \
            "$DAGBO_BASE_URL/api/news-monitor")
          echo "$response" | jq .
          echo "$response" | jq -e '.success == true' >/dev/null || {
            echo "::error::News monitor did not report success. Check Vercel logs and calendar provider access."
            exit 1
          }
