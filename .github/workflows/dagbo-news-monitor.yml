name: DAGBO News and Spike Monitor

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dagbo-news-monitor
  cancel-in-progress: false

jobs:
  notify:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Run five-minute news monitor
        env:
          DAGBO_BASE_URL: https://dagbo-signal.dagboboss1.workers.dev
          SIGNAL_PUSH_SECRET: ${{ secrets.SIGNAL_PUSH_SECRET }}
        run: |
          if [ -z "$SIGNAL_PUSH_SECRET" ]; then
            echo "Missing repository secret SIGNAL_PUSH_SECRET"
            exit 1
          fi
          curl --fail-with-body --silent --show-error --retry 2 --retry-delay 5 \
            -H "Authorization: Bearer $SIGNAL_PUSH_SECRET" \
            "$DAGBO_BASE_URL/api/news-monitor"
