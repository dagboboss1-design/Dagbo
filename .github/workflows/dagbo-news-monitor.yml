name: DAGBO News and Spike Monitor

on:
  push:
    branches: [fix/dagboboss-env-alias]
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dagbo-news-monitor
  cancel-in-progress: false

jobs:
  notify:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Run five-minute news monitor against preview
        env:
          DAGBO_BASE_URL: https://dagboboss-git-fix-dagboboss-env-alias-goodconfort33-4342.vercel.app
          DAGBO_CRON_SECRET: ${{ secrets.DAGBO_CRON_SECRET }}
        run: |
          if [ -z "$DAGBO_CRON_SECRET" ]; then
            echo "::error::Missing repository secret DAGBO_CRON_SECRET"
            exit 1
          fi
          curl --fail-with-body --silent --show-error --retry 2 --retry-delay 5 --max-time 120 \
            --request POST \
            -H "Authorization: Bearer $DAGBO_CRON_SECRET" \
            -H "Content-Type: application/json" \
            --data '{}' \
            "$DAGBO_BASE_URL/api/news-monitor"
