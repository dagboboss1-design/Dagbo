name: DAGBO Market Scanner

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dagbo-market-scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Run 15-minute market scanner
        env:
          DAGBO_BASE_URL: https://dagboboss.vercel.app
          DAGBO_CRON_SECRET: ${{ secrets.DAGBO_CRON_SECRET }}
        run: |
          if [ -z "$DAGBO_CRON_SECRET" ]; then
            echo "::error::Missing repository secret DAGBO_CRON_SECRET"
            exit 1
          fi
          response=$(curl --fail-with-body --silent --show-error --retry 2 --retry-delay 5 --max-time 150 \
            --request POST \
            -H "Authorization: Bearer $DAGBO_CRON_SECRET" \
            -H "Content-Type: application/json" \
            --data '{}' \
            "$DAGBO_BASE_URL/api/cron-scan")
          echo "$response" | jq .
          echo "$response" | jq -e '.success == true and (.scanned | length > 0) and (.errors | length == 0)' >/dev/null || {
            echo "::error::Scanner returned no complete market scan. Check Twelve Data and Vercel runtime logs."
            exit 1
          }
