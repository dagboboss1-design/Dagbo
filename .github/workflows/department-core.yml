name: DAGBO department core tests
on:
  pull_request:
    branches: [main]
  push:
    branches: [main, feature/department-architecture]
jobs:
  department-core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm test
