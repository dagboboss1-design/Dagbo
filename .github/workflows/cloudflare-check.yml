name: Cloudflare compatibility check

on:
  push:
    branches:
      - cloudflare-compat
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  workers-dry-run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Validate Cloudflare Workers bundle without deploying
        run: npx --yes wrangler@latest deploy --dry-run
      - name: Start local Cloudflare Worker
        run: |
          npx --yes wrangler@latest dev --local --ip 127.0.0.1 --port 8787 --log-level error > /tmp/dagbo-worker.log 2>&1 &
          echo $! > /tmp/dagbo-worker.pid
      - name: Smoke-test API routes and static assets
        run: node scripts/cloudflare-smoke.mjs
      - name: Stop local Worker
        if: always()
        run: |
          if [ -f /tmp/dagbo-worker.pid ]; then kill "$(cat /tmp/dagbo-worker.pid)" || true; fi
          if [ -f /tmp/dagbo-worker.log ]; then cat /tmp/dagbo-worker.log; fi
