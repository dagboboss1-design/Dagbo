name: DAGBO SIGNAL manual alert diagnostics

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dagbo-manual-alert-diagnostics
  cancel-in-progress: false

jobs:
  check-alert-endpoints:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check required secret
        env:
          DAGBO_CRON_SECRET: ${{ secrets.DAGBO_CRON_SECRET }}
        run: |
          if [ -z "$DAGBO_CRON_SECRET" ]; then
            echo "::error::Missing repository secret DAGBO_CRON_SECRET"
            exit 1
          fi

      - name: Check market scanner
        env:
          DAGBO_BASE_URL: https://dagboboss.vercel.app
          DAGBO_CRON_SECRET: ${{ secrets.DAGBO_CRON_SECRET }}
        run: |
          curl --fail-with-body --silent --show-error --max-time 150 \
            --request POST \
            -H "Authorization: Bearer $DAGBO_CRON_SECRET" \
            -H "Content-Type: application/json" \
            --data '{}' \
            "$DAGBO_BASE_URL/api/cron-scan" | jq .

      - name: Check news and spike monitor
        env:
          DAGBO_BASE_URL: https://dagboboss.vercel.app
          DAGBO_CRON_SECRET: ${{ secrets.DAGBO_CRON_SECRET }}
        run: |
          curl --fail-with-body --silent --show-error --max-time 120 \
            --request POST \
            -H "Authorization: Bearer $DAGBO_CRON_SECRET" \
            -H "Content-Type: application/json" \
            --data '{}' \
            "$DAGBO_BASE_URL/api/news-monitor" | jq .
