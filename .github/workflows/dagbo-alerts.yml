name: DAGBO SIGNAL scheduled alerts

on:
  schedule:
    # Offset from the hour to reduce GitHub Actions queue delays.
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dagbo-scheduled-alerts
  cancel-in-progress: false

jobs:
  scan-and-news-alerts:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check required secret
        env:
          DAGBO_CRON_SECRET: ${{ secrets.DAGBO_CRON_SECRET }}
        run: |
          if [ -z "$DAGBO_CRON_SECRET" ]; then
            echo "::error::Add DAGBO_CRON_SECRET in GitHub repository Settings > Secrets and variables > Actions."
            exit 1
          fi

      - name: Run 15-minute market scanner
        env:
          DAGBO_CRON_SECRET: ${{ secrets.DAGBO_CRON_SECRET }}
        run: |
          curl --fail-with-body --silent --show-error --max-time 120 \
            --request POST \
            --header "Authorization: Bearer $DAGBO_CRON_SECRET" \
            --header "Content-Type: application/json" \
            --data '{}' \
            "https://dagbo1.vercel.app/api/cron-scan"

      - name: Run economic news alerts
        env:
          DAGBO_CRON_SECRET: ${{ secrets.DAGBO_CRON_SECRET }}
        run: |
          curl --fail-with-body --silent --show-error --max-time 120 \
            --request POST \
            --header "Authorization: Bearer $DAGBO_CRON_SECRET" \
            --header "Content-Type: application/json" \
            --data '{}' \
            "https://dagbo1.vercel.app/api/cron-signal"
