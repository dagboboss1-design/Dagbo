<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F5F5F7" id="themeColor">
<title>Chart · DAGBO SIGNAL</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="stylesheet" href="dagbo.css">
<style>
.back-arrow{display:inline-flex;align-items:center;gap:6px;font-size:16px;font-weight:700;color:var(--dg-text);text-decoration:none;margin-bottom:16px;padding:8px 12px;background:var(--dg-fill);border-radius:12px}
.back-arrow:active{opacity:.6}
#tv-chart-container{height:calc(100vh - 280px);min-height:550px;width:100%;border-radius:16px;overflow:hidden;background:#000;margin-bottom:16px;position:relative}
#tv-chart-container .tradingview-widget-container__widget{width:100%;height:100%}#tv-chart-container iframe{width:100%!important;height:100%!important;border:none!important;display:block}
body.chart-full #tv-chart-container{position:fixed!important;top:0;left:0;right:0;bottom:0;width:100vw!important;height:100dvh!important;z-index:9999;border-radius:0;margin:0}
body.chart-full #tv-chart-container iframe{height:100dvh!important}body.chart-full #tv-chart-container .tradingview-widget-container__widget{height:100dvh!important}
#btnFull{position:absolute;top:10px;right:10px;z-index:20;background:rgba(0,0,0,.88);color:#fff;border:1px solid #555;padding:9px 12px;border-radius:20px;font-size:12px;font-weight:700;cursor:pointer;box-shadow:0 4px 10px rgba(0,0,0,.35)}
.chart-pair-select{appearance:none;-webkit-appearance:none;background:var(--dg-card);border:1px solid var(--dg-line);color:var(--dg-text);font-size:16px;font-weight:700;padding:14px 16px;border-radius:16px;cursor:pointer;width:100%;text-align:center;margin-bottom:12px;box-shadow:var(--dg-shadow)}

#drawingToolsToggle{display:flex;align-items:center;justify-content:center;margin:0 auto 8px 0;width:34px;height:34px;padding:0;border:1px solid var(--dg-line);border-radius:10px;background:var(--dg-card);color:var(--dg-text);font-size:22px;font-weight:800;line-height:1;cursor:pointer}
#pinDrawing{display:block;margin:10px 0 16px auto;padding:8px 16px;border:1px solid var(--dg-line);border-radius:20px;background:var(--dg-card);color:var(--dg-text);font-size:12px;font-weight:800;cursor:pointer}
#chartDrawLayer{position:absolute;inset:0;width:100%;height:100%;z-index:8;pointer-events:none;touch-action:none}
#chartDrawLayer.is-active{pointer-events:auto;cursor:crosshair}
#chartDrawLayer polyline{fill:none;stroke:#f5c542;stroke-width:3;stroke-linecap:round;stroke-linejoin:round;vector-effect:non-scaling-stroke}
#chartPinActions{display:flex;justify-content:flex-end;gap:8px;margin:10px 0 16px}
#pinDrawing,#clearPinned{margin:0}
#clearPinned{padding:8px 12px;border:1px solid var(--dg-line);border-radius:20px;background:var(--dg-card);color:var(--dg-text);font-size:12px;font-weight:700;cursor:pointer}
</style>
<script>
(function(){try{var s=JSON.parse(localStorage.getItem('dagbo_settings'))||{};document.documentElement.setAttribute('data-theme',s.theme==='dark'?'dark':'light')}catch(e){}})();
</script>
</head>
<body>
<main class="dg-page">
<a href="index.html" class="back-arrow">← Back to Home</a>
<div class="dg-top"><div class="dg-brand">◈ DAGBO SIGNAL</div><div class="dg-badge">CHART</div></div>
<h1 class="dg-title">Live Chart</h1>
<p class="dg-subtitle">Real price. Real zones. Check before you enter.</p>
<select id="pairSelect" class="chart-pair-select" onchange="changePair(this.value)"></select>
<div class="dg-seg" role="radiogroup" aria-label="Timeframe" style="margin-bottom:12px" id="tfContainer">
<input class="dg-seg__in" type="radio" name="tf" id="tf1" value="5" onchange="changeTF('5')"><label class="dg-seg__lb" for="tf1">5m</label>
<input class="dg-seg__in" type="radio" name="tf" id="tf2" value="15" onchange="changeTF('15')" checked><label class="dg-seg__lb" for="tf2">15m</label>
<input class="dg-seg__in" type="radio" name="tf" id="tf3" value="60" onchange="changeTF('60')"><label class="dg-seg__lb" for="tf3">1H</label>
<input class="dg-seg__in" type="radio" name="tf" id="tf4" value="240" onchange="changeTF('240')"><label class="dg-seg__lb" for="tf4">4H</label>
<input class="dg-seg__in" type="radio" name="tf" id="tf5" value="D" onchange="changeTF('D')"><label class="dg-seg__lb" for="tf5">1D</label>
</div>
<button id="drawingToolsToggle" type="button" aria-label="Hide drawing tools" aria-expanded="true" title="Hide drawing tools">‹</button><div id="tv-chart-container"><button id="btnFull" onclick="toggleFull()">⛶ FULLSCREEN</button></div><div id="chartPinActions"><button id="pinDrawing" type="button" title="Draw and pin saved marks">📌 Pin drawings</button><button id="clearPinned" type="button" title="Delete saved drawings">Clear saved</button></div>
<a href="replay.html" style="display:flex;justify-content:center;align-items:center;gap:8px;padding:14px;margin:8px 0 18px;border-radius:14px;background:#0878e8;color:#fff;text-decoration:none;font-weight:800">⏪ OPEN HISTORICAL REPLAY</a>
</main>
<nav class="dg-tabbar" aria-label="Main">
<a class="dg-tab" href="index.html"><span class="dg-tab__icon">◈</span>Home</a>
<a class="dg-tab" href="signals.html"><span class="dg-tab__icon">⚡︎</span>Signals</a>
<a class="dg-tab" aria-current="page" href="chart.html"><span class="dg-tab__icon">▥</span>Chart</a>
<a class="dg-tab" href="news.html"><span class="dg-tab__icon">📰</span>News</a>
<a class="dg-tab" href="boss1.html"><span class="dg-tab__icon">👑</span>BOSS1</a>
<a class="dg-tab" href="journal.html"><span class="dg-tab__icon">✎</span>Journal</a>
<a class="dg-tab" href="ai.html"><span class="dg-tab__icon">✦</span>AI</a>
</nav>
<script src="pwa.js" defer></script>
<script>
(function(){
'use strict';
var PAIRS=[
{id:'XAUUSD',label:'GOLD (XAUUSD)',tv:'CAPITALCOM:XAUUSD'},
{id:'EURUSD',label:'EUR/USD',tv:'FOREXCOM:EURUSD'},
{id:'GBPUSD',label:'GBP/USD',tv:'FOREXCOM:GBPUSD'},
{id:'USDJPY',label:'USD/JPY',tv:'FOREXCOM:USDJPY'},
{id:'GBPJPY',label:'GBP/JPY',tv:'FOREXCOM:GBPJPY'},
{id:'AUDUSD',label:'AUD/USD',tv:'FOREXCOM:AUDUSD'},
{id:'USDCHF',label:'USD/CHF',tv:'FOREXCOM:USDCHF'},
{id:'USDCAD',label:'USD/CAD',tv:'FOREXCOM:USDCAD'},
{id:'NZDUSD',label:'NZD/USD',tv:'FOREXCOM:NZDUSD'},
{id:'US30',label:'US30 (Dow)',tv:'CAPITALCOM:US30'},
{id:'US100',label:'US100 (Nasdaq)',tv:'CAPITALCOM:US100'},
{id:'US500',label:'US500 (S&P)',tv:'CAPITALCOM:US500'},
{id:'BTCUSD',label:'Bitcoin',tv:'BINANCE:BTCUSDT'},
{id:'ETHUSD',label:'Ethereum',tv:'BINANCE:ETHUSDT'},
{id:'EURJPY',label:'EUR/JPY',tv:'FOREXCOM:EURJPY'},
{id:'EURGBP',label:'EUR/GBP',tv:'FOREXCOM:EURGBP'}
];
var settings={};try{settings=JSON.parse(localStorage.getItem('dagbo_settings'))||{}}catch(e){}
var enabledIds=Array.isArray(settings.pairs)&&settings.pairs.length?settings.pairs:PAIRS.map(function(p){return p.id});
var activePairs=PAIRS.filter(function(p){return enabledIds.indexOf(p.id)>-1||(enabledIds.indexOf('GOLD')>-1&&p.id==='XAUUSD')});
var currentPair='CAPITALCOM:XAUUSD',currentTF='15';
var drawingToolsVisible=true;try{drawingToolsVisible=localStorage.getItem('dagbo_chart_tools_visible')!=='false'}catch(e){}
function buildDropdown(){
var sel=document.getElementById('pairSelect');sel.innerHTML='';
activePairs.forEach(function(p){var opt=document.createElement('option');opt.value=p.tv;opt.textContent=p.label;sel.appendChild(opt)});
var urlParams=new URLSearchParams(window.location.search),urlPair=urlParams.get('pair');
if(urlPair){var matched=PAIRS.filter(function(p){return p.id===urlPair||(urlPair==='GOLD'&&p.id==='XAUUSD')})[0];if(matched&&activePairs.indexOf(matched)>-1){currentPair=matched.tv;sel.value=currentPair;window.history.replaceState({},'',window.location.pathname)}}
else if(activePairs.length>0){currentPair=activePairs[0].tv;sel.value=currentPair}
}
function updateDrawingToolsToggle(){var b=document.getElementById('drawingToolsToggle');if(!b)return;b.textContent=drawingToolsVisible?'‹':'›';b.setAttribute('aria-expanded',drawingToolsVisible?'true':'false');b.setAttribute('aria-label',drawingToolsVisible?'Hide drawing tools':'Show drawing tools');b.title=drawingToolsVisible?'Hide drawing tools':'Show drawing tools'}
document.getElementById('drawingToolsToggle').addEventListener('click',function(){drawingToolsVisible=!drawingToolsVisible;try{localStorage.setItem('dagbo_chart_tools_visible',drawingToolsVisible?'true':'false')}catch(e){}updateDrawingToolsToggle();loadChart()});
document.getElementById('pinDrawing').addEventListener('click',function(){setPinMode(!pinMode)});
document.getElementById('clearPinned').addEventListener('click',function(){
if(!confirm('Delete all saved drawings for this market and timeframe?'))return;
var all={};try{all=JSON.parse(localStorage.getItem('dagbo_pinned_drawings_v1')||'{}')}catch(e){}
delete all[drawingKey()];try{localStorage.setItem('dagbo_pinned_drawings_v1',JSON.stringify(all))}catch(e){}
renderPinned();
});
var pinMode=false,activeLine=null,drawLayer=null;
function drawingKey(){return 'dagbo_pinned_drawings_v1:'+currentPair+':'+currentTF}
function readPinned(){try{var all=JSON.parse(localStorage.getItem('dagbo_pinned_drawings_v1')||'{}');return Array.isArray(all[drawingKey()])?all[drawingKey()]:[]}catch(e){return []}}
function savePinned(lines){try{var all=JSON.parse(localStorage.getItem('dagbo_pinned_drawings_v1')||'{}');all[drawingKey()]=lines;localStorage.setItem('dagbo_pinned_drawings_v1',JSON.stringify(all))}catch(e){alert('Could not save drawings. Check phone storage space.');}}
function renderPinned(){
if(!drawLayer)return;
drawLayer.textContent='';
readPinned().forEach(function(points){var line=document.createElementNS('http://www.w3.org/2000/svg','polyline');line.setAttribute('points',points);drawLayer.appendChild(line)});
}
function setPinMode(on){
pinMode=!!on;
if(drawLayer)drawLayer.classList.toggle('is-active',pinMode);
var b=document.getElementById('pinDrawing');if(b){b.textContent=pinMode?'✓ Finish drawing':'📌 Pin drawings';b.setAttribute('aria-pressed',String(pinMode))}
}
function bindDrawingLayer(){
drawLayer=document.createElementNS('http://www.w3.org/2000/svg','svg');
drawLayer.setAttribute('id','chartDrawLayer');drawLayer.setAttribute('viewBox','0 0 1000 1000');drawLayer.setAttribute('preserveAspectRatio','none');
drawLayer.addEventListener('pointerdown',function(e){
if(!pinMode)return;
e.preventDefault();drawLayer.setPointerCapture(e.pointerId);
var r=drawLayer.getBoundingClientRect(),x=(e.clientX-r.left)/r.width*1000,y=(e.clientY-r.top)/r.height*1000;
activeLine=document.createElementNS('http://www.w3.org/2000/svg','polyline');
activeLine.setAttribute('points',x.toFixed(1)+','+y.toFixed(1));drawLayer.appendChild(activeLine);
});
drawLayer.addEventListener('pointermove',function(e){
if(!pinMode||!activeLine)return;
var r=drawLayer.getBoundingClientRect(),x=(e.clientX-r.left)/r.width*1000,y=(e.clientY-r.top)/r.height*1000;
var p=activeLine.getAttribute('points');activeLine.setAttribute('points',p+' '+x.toFixed(1)+','+y.toFixed(1));
});
function finishLine(){
if(!activeLine)return;
var pts=activeLine.getAttribute('points').trim();activeLine=null;
if(pts.split(' ').length>1){var saved=readPinned();saved.push(pts);savePinned(saved)}
}
drawLayer.addEventListener('pointerup',finishLine);drawLayer.addEventListener('pointercancel',finishLine);
renderPinned();
}
function loadChart(){
var container=document.getElementById('tv-chart-container'),btn=document.getElementById('btnFull');
container.innerHTML='';
var theme=document.documentElement.getAttribute('data-theme')==='dark'?'dark':'light';
var frame=document.createElement('iframe');
frame.title='TradingView live chart';
frame.src='https://s.tradingview.com/widgetembed/?symbol='+encodeURIComponent(currentPair)+'&interval='+encodeURIComponent(currentTF)+'&theme='+theme+'&style=1&locale=en&timezone=Africa%2FLagos&hide_side_toolbar='+(drawingToolsVisible?'0':'1')+'&symboledit=0&saveimage=0&toolbarbg=%23000000&hide_volume=true';
frame.setAttribute('allowfullscreen','');
frame.style.cssText='width:100%;height:100%;border:0;display:block';
container.appendChild(frame);
bindDrawingLayer();container.appendChild(drawLayer);
container.appendChild(btn);
setPinMode(false);
}
window.changePair=function(tvSymbol){currentPair=tvSymbol;loadChart()};
window.changeTF=function(tf){currentTF=tf;loadChart()};
window.toggleFull=function(){document.body.classList.toggle('chart-full');var btn=document.getElementById('btnFull');btn.textContent=document.body.classList.contains('chart-full')?'✕ CLOSE':'⛶ FULLSCREEN';setTimeout(loadChart,100)};
buildDropdown();updateDrawingToolsToggle();loadChart();
})();
</script>
<script src="navigation.js" defer></script>
</body>
</html>
