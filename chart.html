<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F5F5F7" id="themeColor">
<title>Chart · DAGBO SIGNAL</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="stylesheet" href="dagbo.css">
<style>
.back-arrow{display:inline-flex;align-items:center;gap:6px;font-size:16px;font-weight:700;color:var(--dg-text);text-decoration:none;margin-bottom:16px;padding:8px 12px;background:var(--dg-fill);border-radius:12px}
.back-arrow:active{opacity:.6}
#tv-chart-container{height:calc(100vh - 280px);min-height:550px;width:100%;border-radius:16px;overflow:hidden;background:#000;margin-bottom:16px;position:relative}
#tv-chart-container iframe{width:100%!important;height:100%!important;border:none!important;display:block}
body.chart-full #tv-chart-container{position:fixed!important;top:0;left:0;right:0;bottom:0;width:100vw!important;height:100dvh!important;z-index:9999;border-radius:0;margin:0}
body.chart-full #tv-chart-container iframe{height:100dvh!important}
#btnFull,#btnTools{position:absolute;top:10px;z-index:10;color:#fff;padding:9px 13px;border-radius:20px;font-size:12px;font-weight:700;cursor:pointer;box-shadow:0 4px 10px rgba(0,0,0,.35)}#btnFull{right:10px;background:rgba(0,0,0,.85);border:1px solid #555}#btnTools{left:10px;background:rgba(0,113,227,.94);border:1px solid #0071e3}
.chart-pair-select{appearance:none;-webkit-appearance:none;background:var(--dg-card);border:1px solid var(--dg-line);color:var(--dg-text);font-size:16px;font-weight:700;padding:14px 16px;border-radius:16px;cursor:pointer;width:100%;text-align:center;margin-bottom:12px;box-shadow:var(--dg-shadow)}
</style>
<script>
(function(){try{var s=JSON.parse(localStorage.getItem('dagbo_settings'))||{};document.documentElement.setAttribute('data-theme',s.theme==='dark'?'dark':'light')}catch(e){}})();
</script>
</head>
<body>
<main class="dg-page">
<a href="index.html" class="back-arrow">← Back to Home</a>
<div class="dg-top"><div class="dg-brand">◈ DAGBO SIGNAL</div><div class="dg-badge">CHART</div></div>
<h1 class="dg-title">Live Chart</h1>
<p class="dg-subtitle">Real price. Real zones. Check before you enter.</p>
<select id="pairSelect" class="chart-pair-select" onchange="changePair(this.value)"></select>
<div class="dg-seg" role="radiogroup" aria-label="Timeframe" style="margin-bottom:12px" id="tfContainer">
<input class="dg-seg__in" type="radio" name="tf" id="tf1" value="5" onchange="changeTF('5')"><label class="dg-seg__lb" for="tf1">5m</label>
<input class="dg-seg__in" type="radio" name="tf" id="tf2" value="15" onchange="changeTF('15')" checked><label class="dg-seg__lb" for="tf2">15m</label>
<input class="dg-seg__in" type="radio" name="tf" id="tf3" value="60" onchange="changeTF('60')"><label class="dg-seg__lb" for="tf3">1H</label>
<input class="dg-seg__in" type="radio" name="tf" id="tf4" value="240" onchange="changeTF('240')"><label class="dg-seg__lb" for="tf4">4H</label>
<input class="dg-seg__in" type="radio" name="tf" id="tf5" value="D" onchange="changeTF('D')"><label class="dg-seg__lb" for="tf5">1D</label>
</div>
<div id="tv-chart-container"><button id="btnTools" onclick="toggleTools()" aria-pressed="true">✎ DRAWING TOOLS: ON</button><button id="btnFull" onclick="toggleFull()">⛶ FULLSCREEN</button></div>\n<p class="dg-subtitle" style="font-size:12px;margin-top:-6px">Use the chart toolbar for trend lines, horizontal lines, rectangles and other available drawings. Rotate your phone for more room.</p>
</main>
<nav class="dg-tabbar" aria-label="Main">
<a class="dg-tab" href="index.html"><span class="dg-tab__icon">◈</span>Home</a>
<a class="dg-tab" href="signals.html"><span class="dg-tab__icon">⚡︎</span>Signals</a>
<a class="dg-tab" aria-current="page" href="chart.html"><span class="dg-tab__icon">▥</span>Chart</a>
<a class="dg-tab" href="news.html"><span class="dg-tab__icon">📰</span>News</a>
<a class="dg-tab" href="boss1.html"><span class="dg-tab__icon">👑</span>BOSS1</a>
<a class="dg-tab" href="journal.html"><span class="dg-tab__icon">✎</span>Journal</a>
<a class="dg-tab" href="ai.html"><span class="dg-tab__icon">✦</span>AI</a>
</nav>
<script src="pwa.js" defer></script>
<script>
(function(){
'use strict';
var PAIRS=[
{id:'XAUUSD',label:'GOLD (XAUUSD)',tv:'CAPITALCOM:XAUUSD'},
{id:'EURUSD',label:'EUR/USD',tv:'FOREXCOM:EURUSD'},
{id:'GBPUSD',label:'GBP/USD',tv:'FOREXCOM:GBPUSD'},
{id:'USDJPY',label:'USD/JPY',tv:'FOREXCOM:USDJPY'},
{id:'GBPJPY',label:'GBP/JPY',tv:'FOREXCOM:GBPJPY'},
{id:'AUDUSD',label:'AUD/USD',tv:'FOREXCOM:AUDUSD'},
{id:'USDCHF',label:'USD/CHF',tv:'FOREXCOM:USDCHF'},
{id:'USDCAD',label:'USD/CAD',tv:'FOREXCOM:USDCAD'},
{id:'NZDUSD',label:'NZD/USD',tv:'FOREXCOM:NZDUSD'},
{id:'US30',label:'US30 (Dow)',tv:'CAPITALCOM:US30'},
{id:'US100',label:'US100 (Nasdaq)',tv:'CAPITALCOM:US100'},
{id:'US500',label:'US500 (S&P)',tv:'CAPITALCOM:US500'},
{id:'BTCUSD',label:'Bitcoin',tv:'BINANCE:BTCUSDT'},
{id:'ETHUSD',label:'Ethereum',tv:'BINANCE:ETHUSDT'},
{id:'EURJPY',label:'EUR/JPY',tv:'FOREXCOM:EURJPY'},
{id:'EURGBP',label:'EUR/GBP',tv:'FOREXCOM:EURGBP'}
];
var settings={};try{settings=JSON.parse(localStorage.getItem('dagbo_settings'))||{}}catch(e){}
var enabledIds=Array.isArray(settings.pairs)&&settings.pairs.length?settings.pairs:PAIRS.map(function(p){return p.id});
var activePairs=PAIRS.filter(function(p){return enabledIds.indexOf(p.id)>-1||(enabledIds.indexOf('GOLD')>-1&&p.id==='XAUUSD')});
var currentPair='CAPITALCOM:XAUUSD',currentTF='15',showTools=true;
function buildDropdown(){
var sel=document.getElementById('pairSelect');sel.innerHTML='';
activePairs.forEach(function(p){var opt=document.createElement('option');opt.value=p.tv;opt.textContent=p.label;sel.appendChild(opt)});
var urlParams=new URLSearchParams(window.location.search),urlPair=urlParams.get('pair');
if(urlPair){var matched=PAIRS.filter(function(p){return p.id===urlPair||(urlPair==='GOLD'&&p.id==='XAUUSD')})[0];if(matched&&activePairs.indexOf(matched)>-1){currentPair=matched.tv;sel.value=currentPair;window.history.replaceState({},'',window.location.pathname)}}
else if(activePairs.length>0){currentPair=activePairs[0].tv;sel.value=currentPair}
}
function loadChart(){
var container=document.getElementById('tv-chart-container'),btn=document.getElementById('btnFull'),toolsBtn=document.getElementById('btnTools');
container.innerHTML='';container.appendChild(toolsBtn);container.appendChild(btn);
toolsBtn.textContent=showTools?'✎ DRAWING TOOLS: ON':'✎ DRAWING TOOLS: OFF';toolsBtn.setAttribute('aria-pressed',showTools?'true':'false');
var theme=document.documentElement.getAttribute('data-theme')==='dark'?'dark':'light';
var iframe=document.createElement('iframe');
iframe.src='https://s.tradingview.com/widgetembed/?symbol='+encodeURIComponent(currentPair)+'&interval='+currentTF+'&theme='+theme+'&style=1&locale=en&timezone=Africa%2FLagos&hidesidetoolbar='+ (showTools?'0':'1') +'&symboledit=0&saveimage=0&toolbarbg=rgba(0,0,0,0)&hide_volume=true';
iframe.setAttribute('allowfullscreen','');container.appendChild(iframe);
}
window.changePair=function(tvSymbol){currentPair=tvSymbol;loadChart()};
window.changeTF=function(tf){currentTF=tf;loadChart()};
window.toggleTools=function(){showTools=!showTools;loadChart()};
window.toggleFull=function(){document.body.classList.toggle('chart-full');var btn=document.getElementById('btnFull');btn.textContent=document.body.classList.contains('chart-full')?'✕ CLOSE':'⛶ FULLSCREEN';setTimeout(loadChart,100)};
buildDropdown();loadChart();
})();
</script>
<script src="navigation.js" defer></script>
</body>
</html>
