/* The hosted TradingView frame does not expose its internal toolbar controls.

#drawing-toolbar-cover{position:fixed;z-index:18;left:0;top:0;bottom:72px;width:112px;background:#000;display:none}
#drawing-toolbar-cover.is-hidden{display:block}
#drawing-toolbar-toggle{position:fixed;z-index:25;left:104px;top:50%;transform:translateY(-50%);width:30px;height:66px;border:1px solid #454545;border-left:0;border-radius:0 12px 12px 0;background:#111;color:#fff;font-size:25px;line-height:1;display:flex;align-items:center;justify-content:center;box-shadow:0 2px 12px #0009;touch-action:manipulation}
#drawing-toolbar-toggle.is-hidden{left:0;border-left:1px solid #454545;border-radius:0 12px 12px 0}
#drawing-toolbar-toggle:focus-visible{outline:2px solid #fff;outline-offset:2px}

<script>
(()=>{const cover=document.getElementById('drawing-toolbar-cover');const toggle=document.getElementById('drawing-toolbar-toggle');const key='dagbo_chart_drawing_toolbar_hidden';let hidden=false;try{hidden=localStorage.getItem(key)==='1'}catch(e){}
function apply(){cover.classList.toggle('is-hidden',hidden);toggle.classList.toggle('is-hidden',hidden);toggle.textContent=hidden?'›':'‹';toggle.setAttribute('aria-pressed',String(hidden));toggle.setAttribute('aria-label',hidden?'Show drawing toolbar':'Hide drawing toolbar');toggle.title=hidden?'Show drawing toolbar':'Hide drawing toolbar'}
toggle.addEventListener('click',()=>{hidden=!hidden;try{localStorage.setItem(key,hidden?'1':'0')}catch(e){}apply()});apply()})();
</script>
