<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F5F5F7">
<title>Chart · DAGBO SIGNAL</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="stylesheet" href="dagbo.css">
<style>
  /* THE FIX: Force the container height and position */
  #tv-chart-container {
    width: 100%;
    height: 75vh;
    min-height: 560px;
    max-height: 900px;
    border-radius: 16px;
    overflow: hidden;
    background: #000;
    margin-bottom: 16px;
    position: relative;
  }

  /* Force the iframe to fill the absolute space */
  #tv-chart-container iframe {
    position: absolute;
    inset: 0;
    width: 100% !important;
    height: 100% !important;
    display: block;
    border: none !important;
  }
  
  .chart-pair-select {
    appearance: none; -webkit-appearance: none;
    background: var(--dg-card);
    border: 1px solid var(--dg-line);
    color: var(--dg-text);
    font-size: 16px; font-weight: 700;
    padding: 14px 16px;
    border-radius: 16px;
    cursor: pointer; width: 100%;
    text-align: center; margin-bottom: 12px;
  }
</style>
<script>
  (function(){
    try{
      var s = JSON.parse(localStorage.getItem('dagbo_settings')) || {};
      var dark = s.theme === 'dark';
      document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
    }catch(e){}
  })();
</script>
</head>
<body>
<main class="dg-page">
  <div class="dg-top">
    <div class="dg-brand">◈ DAGBO SIGNAL</div>
    <div class="dg-badge">CHART</div>
  </div>
  <h1 class="dg-title">Live Chart</h1>
  <p class="dg-subtitle">Real price. Real zones. Check before you enter.</p>

  <select id="pairSelect" class="chart-pair-select" onchange="changePair(this.value)"></select>

  <div class="dg-seg" role="radiogroup" aria-label="Timeframe" style="margin-bottom:12px" id="tfContainer">
    <input class="dg-seg__in" type="radio" name="tf" id="tf1" value="5" onchange="changeTF('5')"><label class="dg-seg__lb" for="tf1">5m</label>
    <input class="dg-seg__in" type="radio" name="tf" id="tf2" value="15" onchange="changeTF('15')" checked><label class="dg-seg__lb" for="tf2">15m</label>
    <input class="dg-seg__in" type="radio" name="tf" id="tf3" value="60" onchange="changeTF('60')"><label class="dg-seg__lb" for="tf3">1H</label>
    <input class="dg-seg__in" type="radio" name="tf" id="tf4" value="240" onchange="changeTF('240')"><label class="dg-seg__lb" for="tf4">4H</label>
    <input class="dg-seg__in" type="radio" name="tf" id="tf5" value="D" onchange="changeTF('D')"><label class="dg-seg__lb" for="tf5">1D</label>
  </div>

  <!-- Chart Box -->
  <div id="tv-chart-container"></div>

</main>

<nav class="dg-tabbar" aria-label="Main">
  <a class="dg-tab" href="index.html"><span class="dg-tab__icon">◈</span>Home</a>
  <a class="dg-tab" href="signals.html"><span class="dg-tab__icon">⚡︎</span>Signals</a>
  <a class="dg-tab" aria-current="page" href="chart.html"><span class="dg-tab__icon">▥</span>Chart</a>
  <a class="dg-tab" href="ai.html"><span class="dg-tab__icon">✦</span>AI</a>
  <a class="dg-tab" href="journal.html"><span class="dg-tab__icon">✎</span>Journal</a>
</nav>

<script src="pwa.js" defer></script>
<script>
(function(){
  'use strict';
  var PAIRS = [
    { id: 'XAUUSD', label: 'GOLD (XAUUSD)', tv: 'CAPITALCOM:XAUUSD' },
    { id: 'EURUSD', label: 'EUR/USD', tv: 'FOREXCOM:EURUSD' },
    { id: 'GBPUSD', label: 'GBP/USD', tv: 'FOREXCOM:GBPUSD' },
    { id: 'USDJPY', label: 'USD/JPY', tv: 'FOREXCOM:USDJPY' },
    { id: 'GBPJPY', label: 'GBP/JPY', tv: 'FOREXCOM:GBPJPY' },
    { id: 'AUDUSD', label: 'AUD/USD', tv: 'FOREXCOM:AUDUSD' },
    { id: 'USDCHF', label: 'USD/CHF', tv: 'FOREXCOM:USDCHF' },
    { id: 'USDCAD', label: 'USD/CAD', tv: 'FOREXCOM:USDCAD' },
    { id: 'NZDUSD', label: 'NZD/USD', tv: 'FOREXCOM:NZDUSD' },
    { id: 'US30',   label: 'US30 (Dow)', tv: 'CAPITALCOM:US30' },
    { id: 'US100',  label: 'US100 (Nasdaq)', tv: 'CAPITALCOM:US100' },
    { id: 'US500',  label: 'US500 (S&P)', tv: 'CAPITALCOM:US500' },
    { id: 'BTCUSD', label: 'Bitcoin', tv: 'BINANCE:BTCUSDT' },
    { id: 'ETHUSD', label: 'Ethereum', tv: 'BINANCE:ETHUSDT' },
    { id: 'EURJPY', label: 'EUR/JPY', tv: 'FOREXCOM:EURJPY' },
    { id: 'EURGBP', label: 'EUR/GBP', tv: 'FOREXCOM:EURGBP' }
  ];
  var settings = {};
  try { settings = JSON.parse(localStorage.getItem('dagbo_settings')) || {}; } catch(e){}
  var enabledIds = Array.isArray(settings.pairs) && settings.pairs.length ? settings.pairs : PAIRS.map(function(p){ return p.id; });
  var activePairs = PAIRS.filter(function(p){ return enabledIds.indexOf(p.id) > -1 || (enabledIds.indexOf('GOLD') > -1 && p.id === 'XAUUSD'); });
  
  var currentPair = 'CAPITALCOM:XAUUSD';
  var currentTF = '15';

  function buildDropdown() {
    var sel = document.getElementById('pairSelect');
    sel.innerHTML = '';
    activePairs.forEach(function(p) {
      var opt = document.createElement('option');
      opt.value = p.tv; opt.textContent = p.label;
      sel.appendChild(opt);
    });
    var urlParams = new URLSearchParams(window.location.search);
    var urlPair = urlParams.get('pair');
    if (urlPair) {
      var matched = PAIRS.filter(function(p){ return p.id === urlPair || (urlPair === 'GOLD' && p.id === 'XAUUSD'); })[0];
      if (matched && activePairs.indexOf(matched) > -1) { currentPair = matched.tv; sel.value = currentPair; }
    } else {
      if (activePairs.length > 0) { currentPair = activePairs[0].tv; sel.value = currentPair; }
    }
  }

  // THE MAGIC FIX FROM YOUR CODE
  function loadChart() {
    var container = document.getElementById('tv-chart-container');
    container.innerHTML = '';

    var isDark = document.documentElement.getAttribute('data-theme') === 'dark';
    var theme = isDark ? 'dark' : 'light';

    // Give TradingView the actual chart height
    var chartHeight = Math.max(
      560,
      Math.min(900, Math.floor(window.innerHeight * 0.75))
    );

    container.style.height = chartHeight + 'px';

    var iframe = document.createElement('iframe');
    iframe.title = 'DAGBO SIGNAL Live Trading Chart';

    iframe.src = 'https://s.tradingview.com/widgetembed/?symbol=' +
      encodeURIComponent(currentPair) +
      '&interval=' + currentTF +
      '&theme=' + theme +
      '&style=1' +
      '&locale=en' +
      '&timezone=Africa%2FLagos' +
      '&width=100%25' +
      '&height=' + chartHeight +
      '&hidesidetoolbar=0' +
      '&symboledit=0' +
      '&saveimage=0' +
      '&toolbarbg=rgba(0,0,0,0)' +
      '&studies=RSI%40tv-basicstudies';

    container.appendChild(iframe);
  }

  window.changePair = function(tvSymbol) { currentPair = tvSymbol; loadChart(); };
  window.changeTF = function(tf) { currentTF = tf; loadChart(); };

  buildDropdown();
  loadChart();
})();
</script>
</body>
  </html>
