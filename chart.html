<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F5F5F7" id="themeColor">
<title>Chart · DAGBO SIGNAL</title>

<!-- PWA Links -->
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">

<!-- THE NEW DESIGN SYSTEM -->
<link rel="stylesheet" href="dagbo.css">

<style>
  /* Specific styles for the Chart page */
  #tv-chart-container {
    height: 600px;
    width: 100%;
    border-radius: var(--dg-r-card);
    overflow: hidden;
    box-shadow: var(--dg-shadow);
    background: #000; /* Fallback for dark chart */
    margin-bottom: 16px;
  }
  /* Make the pair dropdown look like an Apple picker */
  .chart-pair-select {
    appearance: none;
    -webkit-appearance: none;
    background: var(--dg-card);
    border: none;
    color: var(--dg-text);
    font-size: 16px;
    font-weight: 600;
    padding: 10px 16px;
    border-radius: var(--dg-r-pill);
    box-shadow: var(--dg-shadow);
    cursor: pointer;
    width: 100%;
    text-align: center;
  }
  .chart-pair-select:focus {
    outline: 2px solid var(--dg-blue);
  }
</style>

<script>
  (function(){
    try{
      var s = JSON.parse(localStorage.getItem('dagbo_settings')) || {};
      var follow = s.followSystem !== false;
      var dark = follow ? window.matchMedia('(prefers-color-scheme: dark)').matches : s.theme === 'dark';
      document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
    }catch(e){}
  })();
</script>
</head>
<body>

<main class="dg-page">

  <!-- Top Header -->
  <div class="dg-top">
    <div class="dg-brand">◈ DAGBO SIGNAL</div>
    <div class="dg-badge">CHART</div>
  </div>
  
  <h1 class="dg-title">Live Chart</h1>
  <p class="dg-subtitle">Real price. Real zones. Check before you enter.</p>

  <!-- Pair Selector (Styled like Apple) -->
  <div style="margin-bottom:12px">
    <select id="pairSelect" class="chart-pair-select" onchange="changePair(this.value)">
      <!-- Options filled by JS -->
    </select>
  </div>

  <!-- Timeframe Toggles -->
  <div class="dg-seg" role="radiogroup" aria-label="Timeframe" style="margin-bottom:16px" id="tfContainer">
    <input class="dg-seg__in" type="radio" name="tf" id="tf1" value="5" onchange="changeTF('5')"><label class="dg-seg__lb" for="tf1">5m</label>
    <input class="dg-seg__in" type="radio" name="tf" id="tf2" value="15" onchange="changeTF('15')" checked><label class="dg-seg__lb" for="tf2">15m</label>
    <input class="dg-seg__in" type="radio" name="tf" id="tf3" value="60" onchange="changeTF('60')"><label class="dg-seg__lb" for="tf3">1H</label>
    <input class="dg-seg__in" type="radio" name="tf" id="tf4" value="240" onchange="changeTF('240')"><label class="dg-seg__lb" for="tf4">4H</label>
    <input class="dg-seg__in" type="radio" name="tf" id="tf5" value="D" onchange="changeTF('D')"><label class="dg-seg__lb" for="tf5">1D</label>
  </div>

  <!-- The TradingView Chart Box -->
  <div id="tv-chart-container">
    <div id="tradingview_widget"></div>
  </div>

  <!-- Quick Actions -->
  <div class="dg-btn-row" style="margin-top:20px">
    <a href="ai.html" class="dg-btn dg-btn--tinted" style="text-decoration:none">Ask AI 🤖</a>
    <a href="journal.html" class="dg-btn dg-btn--primary" style="text-decoration:none">Go to Journal 📓</a>
  </div>

  <p class="dg-note" style="margin-top:24px">
    Price data is provided by TradingView.<br>DAGBO never connects to your broker.
  </p>

</main>

<!-- BOTTOM TAB BAR -->
<nav class="dg-tabbar" aria-label="Main">
  <a class="dg-tab" href="index.html"><span class="dg-tab__icon">◈</span>Home</a>
  <a class="dg-tab" href="signals.html"><span class="dg-tab__icon">⚡︎</span>Signals</a>
  <a class="dg-tab" aria-current="page" href="chart.html"><span class="dg-tab__icon">▥</span>Chart</a>
  <a class="dg-tab" href="ai.html"><span class="dg-tab__icon">✦</span>AI</a>
  <a class="dg-tab" href="journal.html"><span class="dg-tab__icon">✎</span>Journal</a>
</nav>

<!-- TradingView Library -->
<script type="text/javascript" src="https://s3.tradingview.com/tv.js"></script>
<script src="pwa.js" defer></script>

<script>
(function(){
  'use strict';

  // 1. Master list of pairs with correct TradingView symbols
  var PAIRS = [
    { id: 'XAUUSD', label: 'GOLD (XAUUSD)', tv: 'CAPITALCOM:XAUUSD' },
    { id: 'EURUSD', label: 'EUR/USD', tv: 'FOREXCOM:EURUSD' },
    { id: 'GBPUSD', label: 'GBP/USD', tv: 'FOREXCOM:GBPUSD' },
    { id: 'USDJPY', label: 'USD/JPY', tv: 'FOREXCOM:USDJPY' },
    { id: 'GBPJPY', label: 'GBP/JPY', tv: 'FOREXCOM:GBPJPY' },
    { id: 'AUDUSD', label: 'AUD/USD', tv: 'FOREXCOM:AUDUSD' },
    { id: 'USDCHF', label: 'USD/CHF', tv: 'FOREXCOM:USDCHF' },
    { id: 'USDCAD', label: 'USD/CAD', tv: 'FOREXCOM:USDCAD' },
    { id: 'NZDUSD', label: 'NZD/USD', tv: 'FOREXCOM:NZDUSD' },
    { id: 'US30',   label: 'US30 (Dow)', tv: 'CAPITALCOM:US30' },
    { id: 'US100',  label: 'US100 (Nasdaq)', tv: 'CAPITALCOM:US100' },
    { id: 'US500',  label: 'US500 (S&P)', tv: 'CAPITALCOM:US500' },
    { id: 'BTCUSD', label: 'Bitcoin', tv: 'BINANCE:BTCUSDT' },
    { id: 'ETHUSD', label: 'Ethereum', tv: 'BINANCE:ETHUSDT' },
    { id: 'EURJPY', label: 'EUR/JPY', tv: 'FOREXCOM:EURJPY' },
    { id: 'EURGBP', label: 'EUR/GBP', tv: 'FOREXCOM:EURGBP' }
  ];

  var settings = {};
  try { settings = JSON.parse(localStorage.getItem('dagbo_settings')) || {}; } catch(e){}
  
  // Get enabled pairs from settings, or show all if none
  var enabledIds = Array.isArray(settings.pairs) && settings.pairs.length ? settings.pairs : PAIRS.map(function(p){ return p.id; });
  
  // Filter master list to only show enabled ones
  var activePairs = PAIRS.filter(function(p){
    return enabledIds.indexOf(p.id) > -1 || enabledIds.indexOf('GOLD') > -1 && p.id === 'XAUUSD';
  });

  var currentPair = 'CAPITALCOM:XAUUSD';
  var currentTF = '15';
  var widget = null;

  // 2. Build the Dropdown Options
  function buildDropdown() {
    var sel = document.getElementById('pairSelect');
    sel.innerHTML = '';
    activePairs.forEach(function(p) {
      var opt = document.createElement('option');
      opt.value = p.tv;
      opt.textContent = p.label;
      sel.appendChild(opt);
    });

    // Check URL for a specific pair (e.g. from Signals page)
    var urlParams = new URLSearchParams(window.location.search);
    var urlPair = urlParams.get('pair');
    if (urlPair) {
      // Find the TV symbol for this pair
      var matched = PAIRS.filter(function(p){ return p.id === urlPair || (urlPair === 'GOLD' && p.id === 'XAUUSD'); })[0];
      if (matched && activePairs.indexOf(matched) > -1) {
        currentPair = matched.tv;
        sel.value = currentPair;
        // Clean URL so refresh doesn't re-force the pair
        window.history.replaceState({}, '', window.location.pathname);
      }
    } else {
      // Default to first available
      if (activePairs.length > 0) {
        currentPair = activePairs[0].tv;
        sel.value = currentPair;
      }
    }
  }

  // 3. Load TradingView Widget
  function loadChart() {
    var container = document.getElementById('tradingview_widget');
    container.innerHTML = ''; // Clear existing

    var isDark = document.documentElement.getAttribute('data-theme') === 'dark';

    widget = new TradingView.widget({
      "autosize": true,
      "symbol": currentPair,
      "interval": currentTF,
      "timezone": "Africa/Lagos",
      "theme": isDark ? "dark" : "light",
      "style": "1",
      "locale": "en",
      "enable_publishing": false,
      "hide_side_toolbar": true,
      "allow_symbol_change": false,
      "container_id": "tradingview_widget",
      "studies": [
        "RSI@tv-basicstudies"
      ]
    });
  }

  // 4. Global functions for HTML onClick handlers
  window.changePair = function(tvSymbol) {
    currentPair = tvSymbol;
    loadChart();
  };

  window.changeTF = function(tf) {
    currentTF = tf;
    loadChart();
  };

  // 5. Initialize
  buildDropdown();
  loadChart();

  // Listen for theme changes (if user changes settings while on this page)
  var mq = window.matchMedia('(prefers-color-scheme: dark)');
  mq.addEventListener('change', function() {
    var follow = settings.followSystem !== false;
    if (follow) {
      var newDark = mq.matches;
      document.documentElement.setAttribute('data-theme', newDark ? 'dark' : 'light');
      loadChart();
    }
  });

})();
</script>
</body>
</html>
