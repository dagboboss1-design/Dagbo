<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F5F5F7" id="themeColor">
<title>Signals · DAGBO SIGNAL</title>

<!-- PWA Links -->
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">

<!-- THE NEW DESIGN SYSTEM -->
<link rel="stylesheet" href="dagbo.css">

<script>
  (function(){
    try{
      var s = JSON.parse(localStorage.getItem('dagbo_settings')) || {};
      var follow = s.followSystem !== false;
      var dark = follow ? window.matchMedia('(prefers-color-scheme: dark)').matches : s.theme === 'dark';
      document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
    }catch(e){}
  })();
</script>
</head>
<body>

<main class="dg-page">

  <!-- Top Header -->
  <div class="dg-top">
    <div class="dg-brand">◈ DAGBO SIGNAL</div>
    <div class="dg-badge">SIGNALS</div>
  </div>
  
  <h1 class="dg-title">Signal Board</h1>
  <p class="dg-subtitle">3 systems. 1 final signal.</p>

  <!-- Category Filters -->
  <div class="dg-chips" id="filterChips">
    <button class="dg-chip is-active" data-filter="ALL">All Signals</button>
    <button class="dg-chip" data-filter="FX">Forex</button>
    <button class="dg-chip" data-filter="GOLD">Gold</button>
    <button class="dg-chip" data-filter="INDEX">Indices</button>
    <button class="dg-chip" data-filter="CRYPTO">Crypto</button>
  </div>

  <!-- The Signal Cards Grid -->
  <div class="dg-stack" id="signals-grid" style="margin-top:12px">
    <!-- Cards will be generated here by JavaScript -->
  </div>

  <!-- Disclaimer -->
  <div class="dg-card" style="background:var(--dg-fill);box-shadow:none;margin-top:24px">
    <p class="dg-muted" style="font-size:13px;line-height:1.6;margin:0">
      <b>⚠️ DEMO SIGNALS ONLY:</b> These are randomly generated examples for learning. They do not use live market data. Always open the Chart page to see the real price before you trade.
    </p>
  </div>

</main>

<!-- BOTTOM TAB BAR -->
<nav class="dg-tabbar" aria-label="Main">
  <a class="dg-tab" href="index.html"><span class="dg-tab__icon">◈</span>Home</a>
  <a class="dg-tab" aria-current="page" href="signals.html"><span class="dg-tab__icon">⚡︎</span>Signals</a>
  <a class="dg-tab" href="chart.html"><span class="dg-tab__icon">▥</span>Chart</a>
  <a class="dg-tab" href="ai.html"><span class="dg-tab__icon">✦</span>AI</a>
  <a class="dg-tab" href="journal.html"><span class="dg-tab__icon">✎</span>Journal</a>
</nav>

<script src="pwa.js" defer></script>
<script>
(function(){
  'use strict';

  var settings = {};
  try { settings = JSON.parse(localStorage.getItem('dagbo_settings')) || {}; } catch(e){}
  
  var enabledPairs = Array.isArray(settings.pairs) ? settings.pairs : ['XAUUSD', 'EURUSD', 'GBPUSD', 'US30', 'US100', 'BTCUSD'];
  
  // Define pair categories for filtering
  var PAIR_TYPES = {
    XAUUSD: 'GOLD', GOLD: 'GOLD',
    EURUSD: 'FX', GBPUSD: 'FX', USDJPY: 'FX', GBPJPY: 'FX', AUDUSD: 'FX', USDCHF: 'FX', USDCAD: 'FX', NZDUSD: 'FX', EURJPY: 'FX', EURGBP: 'FX',
    US30: 'INDEX', US100: 'INDEX', NAS100: 'INDEX', US500: 'INDEX',
    BTCUSD: 'CRYPTO', BTC: 'CRYPTO', ETHUSD: 'CRYPTO', ETH: 'CRYPTO'
  };

  var currentFilter = 'ALL';

  // Generate a realistic looking demo signal
  function makeSignal(pair) {
    var seed = new Date().toDateString() + pair + Math.random();
    var hash = 0; for (var i = 0; i < seed.length; i++) hash = ((hash << 5) - hash) + seed.charCodeAt(i);
    var rand = Math.abs(hash) / 2147483647;
    
    var finals = ['STRONG BUY', 'WEAK BUY', 'STRONG SELL', 'WEAK SELL', 'NO TRADE'];
    var final = finals[Math.floor(rand * finals.length)];
    
    var isBuy = final.includes('BUY');
    var isSell = final.includes('SELL');
    
    var anchor = 100, stop = 5, dp = 2;
    var p = String(pair).toUpperCase();
    if (p.indexOf('XAU') > -1 || p === 'GOLD') { anchor = 2350; stop = 15; dp = 2; }
    else if (p.indexOf('JPY') > -1) { anchor = 150; stop = 0.5; dp = 3; }
    else if (p.indexOf('BTC') > -1) { anchor = 65000; stop = 400; dp = 0; }
    else if (p.indexOf('ETH') > -1) { anchor = 3500; stop = 45; dp = 0; }
    else if (p.indexOf('US30') > -1) { anchor = 39500; stop = 150; dp = 0; }
    else if (p.indexOf('US100') > -1 || p.indexOf('NAS') > -1) { anchor = 18000; stop = 100; dp = 0; }
    else if (p.indexOf('US500') > -1) { anchor = 5000; stop = 35; dp = 0; }
    else { anchor = 1.0850; stop = 0.0020; dp = 5; } // default forex
    
    var entry = anchor + (rand - 0.5) * stop;
    var sl = isBuy ? entry - stop : entry + stop;
    var tp1 = isBuy ? entry + stop * 1.5 : entry - stop * 1.5;
    var tp2 = isBuy ? entry + stop * 2.5 : entry - stop * 2.5;
    
    function fmt(v) { return v.toFixed(dp); }

    var cls = isBuy ? 'dg-signal__word--buy' : (isSell ? 'dg-signal__word--sell' : 'dg-signal__word--wait');
    var pillCls = isBuy ? 'dg-pill--buy' : (isSell ? 'dg-pill--sell' : 'dg-pill--wait');
    var pillText = isBuy ? 'BUY' : (isSell ? 'SELL' : 'WAIT');
    
    // Random time in past 2 hours
    var minsAgo = Math.floor(rand * 120);
    var d = new Date(Date.now() - minsAgo * 60000);
    var timeStr = d.toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'}) + ' • ' + d.toLocaleDateString('en-GB', {day: 'numeric', month: 'short'});
    
    return { pair: pair, final: final, cls: cls, pillCls: pillCls, pillText: pillText, entry: fmt(entry), sl: fmt(sl), tp1: fmt(tp1), tp2: fmt(tp2), time: timeStr, isNoTrade: final === 'NO TRADE' };
  }

  function renderCards() {
    var grid = document.getElementById('signals-grid');
    var listHtml = '';
    
    var sortedPairs = enabledPairs.slice().sort(function(a,b){
      var typeA = PAIR_TYPES[String(a).toUpperCase()] || 'FX';
      var typeB = PAIR_TYPES[String(b).toUpperCase()] || 'FX';
      if (typeA === typeB) return 0;
      if (typeA === 'GOLD') return -1;
      if (typeB === 'GOLD') return 1;
      return typeA.localeCompare(typeB);
    });

    sortedPairs.forEach(function(pair) {
      var type = PAIR_TYPES[String(pair).toUpperCase()] || 'FX';
      if (currentFilter !== 'ALL' && currentFilter !== type) return;
      
      var s = makeSignal(pair);
      
      var cardInner = '';
      if (s.isNoTrade) {
        cardInner = 
          '<div style="text-align:center;padding:16px 0">' +
            '<div class="dg-signal__word ' + s.cls + '" style="font-size:28px">NO TRADE</div>' +
            '<div class="dg-muted" style="font-size:13px;margin-top:4px">One system says WAIT</div>' +
          '</div>';
      } else {
        cardInner = 
          '<div class="dg-signal__word ' + s.cls + '" style="font-size:28px;text-align:left">' + s.final + '</div>' +
          '<div class="dg-muted" style="font-size:13px;margin-bottom:12px">' + (s.final.includes('BUY') ? 'Bullish Pressure' : 'Bearish Pressure') + '</div>' +
          '<div class="dg-grid-4" style="display:grid;grid-template-columns:1fr 1fr;gap:8px">' +
            '<div class="dg-level" style="padding:8px 10px"><span style="font-size:11px">Entry</span><strong style="font-size:15px">' + s.entry + '</strong></div>' +
            '<div class="dg-level" style="padding:8px 10px"><span style="font-size:11px">Stop Loss</span><strong style="font-size:15px" class="dg-neg">' + s.sl + '</strong></div>' +
            '<div class="dg-level" style="padding:8px 10px"><span style="font-size:11px">TP 1</span><strong style="font-size:15px" class="dg-pos">' + s.tp1 + '</strong></div>' +
            '<div class="dg-level" style="padding:8px 10px"><span style="font-size:11px">TP 2</span><strong style="font-size:15px" class="dg-pos">' + s.tp2 + '</strong></div>' +
          '</div>';
      }

      listHtml += 
        '<section class="dg-card" style="padding:16px;margin-bottom:12px">' +
          '<div class="dg-card__head" style="margin-bottom:8px">' +
            '<div style="display:flex;align-items:center;gap:8px">' +
              '<h2 class="dg-card__title" style="font-size:18px;margin:0">' + s.pair + '</h2>' +
              '<span class="dg-pill ' + s.pillCls + '" style="min-height:22px;font-size:11px;padding:0 8px">' + s.pillText + '</span>' +
            '</div>' +
            '<span style="font-size:11px;color:var(--dg-text-2)">' + s.time + '</span>' +
          '</div>' +
          cardInner +
          '<div style="margin-top:12px;border-top:0.5px solid var(--dg-line);padding-top:12px;text-align:right">' +
            '<a href="chart.html?pair=' + s.pair + '" style="font-size:14px;font-weight:600;text-decoration:none;color:var(--dg-blue-ink)">View Chart →</a>' +
          '</div>' +
        '</section>';
    });
    
    if (listHtml === '') {
      listHtml = '<div class="dg-card" style="text-align:center;padding:32px 16px"><p class="dg-muted">No signals for this category.</p></div>';
    }
    
    grid.innerHTML = listHtml;
  }

  // Filter Buttons
  document.getElementById('filterChips').addEventListener('click', function(e){
    var btn = e.target.closest('.dg-chip');
    if (!btn) return;
    document.querySelectorAll('#filterChips .dg-chip').forEach(function(c){ c.classList.remove('is-active'); });
    btn.classList.add('is-active');
    currentFilter = btn.dataset.filter;
    renderCards();
  });

  // Initial Render
  renderCards();

})();
</script>
</body>
  </html>
