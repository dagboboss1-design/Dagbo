<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F5F5F7" id="themeColor">
<title>Journal · DAGBO SIGNAL</title>

<!-- PWA Links -->
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">

<!-- THE NEW DESIGN SYSTEM -->
<link rel="stylesheet" href="dagbo.css">

<script>
  (function(){
    try{
      var s = JSON.parse(localStorage.getItem('dagbo_settings')) || {};
      var follow = s.followSystem !== false;
      var dark = follow ? window.matchMedia('(prefers-color-scheme: dark)').matches : s.theme === 'dark';
      document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
    }catch(e){}
  })();
</script>
</head>
<body>

<main class="dg-page">

  <!-- Top Header -->
  <div class="dg-top">
    <div class="dg-brand">◈ DAGBO SIGNAL</div>
    <div class="dg-badge">JOURNAL</div>
  </div>
  
  <div style="display:flex;justify-content:space-between;align-items:flex-end;margin:18px 4px 6px">
    <div>
      <h1 class="dg-title" style="margin:0">Trading Journal</h1>
      <p class="dg-subtitle" style="margin:4px 0 0">Track your trades. Improve your results.</p>
    </div>
  </div>

  <!-- Stat Grid (Top Cards) -->
  <div class="dg-grid-2" style="margin-bottom:20px">
    <div class="dg-stat" style="text-align:left;padding:16px">
      <span class="dg-stat__label">Total Trades</span>
      <span class="dg-stat__value" id="statTotal">0</span>
    </div>
    <div class="dg-stat" style="text-align:left;padding:16px">
      <span class="dg-stat__label">Win Rate</span>
      <span class="dg-stat__value dg-key" id="statWinRate">—</span>
    </div>
    <div class="dg-stat" style="text-align:left;padding:16px">
      <span class="dg-stat__label">Net Profit</span>
      <span class="dg-stat__value" id="statPnl">—</span>
    </div>
    <div class="dg-stat" style="text-align:left;padding:16px">
      <span class="dg-stat__label">Avg R/R</span>
      <span class="dg-stat__value" id="statRR">—</span>
    </div>
  </div>

  <!-- Filter Pills -->
  <div class="dg-seg" role="radiogroup" aria-label="Filter" style="margin-bottom:16px" id="filterGroup">
    <input class="dg-seg__in" type="radio" name="filter" id="f1" checked onchange="filterTrades('ALL')"><label class="dg-seg__lb" for="f1">All</label>
    <input class="dg-seg__in" type="radio" name="filter" id="f2" onchange="filterTrades('WIN')"><label class="dg-seg__lb" for="f2">Wins</label>
    <input class="dg-seg__in" type="radio" name="filter" id="f3" onchange="filterTrades('LOSS')"><label class="dg-seg__lb" for="f3">Losses</label>
    <input class="dg-seg__in" type="radio" name="filter" id="f4" onchange="filterTrades('OPEN')"><label class="dg-seg__lb" for="f4">Open</label>
  </div>

  <!-- Trade List -->
  <div class="dg-stack" id="tradeList">
    <!-- Trades injected here -->
  </div>

  <!-- Add Trade Button (Floating or Bottom) -->
  <div style="margin-top:24px">
    <button class="dg-btn dg-btn--primary dg-btn--block" onclick="openForm()">+ Add New Trade</button>
  </div>

  <!-- Disclaimer -->
  <p class="dg-note" style="margin-top:24px">
    This journal only saves to your phone.<br>It is not connected to any broker.
  </p>

</main>

<!-- BOTTOM TAB BAR -->
<nav class="dg-tabbar" aria-label="Main">
  <a class="dg-tab" href="index.html"><span class="dg-tab__icon">◈</span>Home</a>
  <a class="dg-tab" href="signals.html"><span class="dg-tab__icon">⚡︎</span>Signals</a>
  <a class="dg-tab" href="chart.html"><span class="dg-tab__icon">▥</span>Chart</a>
  <a class="dg-tab" href="ai.html"><span class="dg-tab__icon">✦</span>AI</a>
  <a class="dg-tab" aria-current="page" href="journal.html"><span class="dg-tab__icon">✎</span>Journal</a>
</nav>

<!-- THE MODAL FORM FOR ADDING TRADES -->
<div id="tradeModal" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,0.6);z-index:100;align-items:flex-end;justify-content:center;backdrop-filter:blur(4px)">
  <div class="dg-card" style="width:100%;max-width:560px;margin:0;border-radius:24px 24px 0 0;max-height:90vh;overflow-y:auto;padding:24px">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px">
      <h2 class="dg-card__title" id="formTitle">New Trade</h2>
      <button class="dg-btn" style="min-height:30px;padding:0 10px;border-radius:20px" onclick="closeForm()">✕</button>
    </div>
    
    <label class="dg-field"><span class="dg-label">Pair</span><select id="fPair" class="dg-input"></select></label>
    
    <div class="dg-grid-2" style="margin-top:14px">
      <label class="dg-field" style="margin:0"><span class="dg-label">Direction</span>
        <select id="fDir" class="dg-input"><option value="BUY">BUY</option><option value="SELL">SELL</option></select>
      </label>
      <label class="dg-field" style="margin:0"><span class="dg-label">Result</span>
        <select id="fResult" class="dg-input"><option value="OPEN">OPEN</option><option value="WIN">WIN</option><option value="LOSS">LOSS</option></select>
      </label>
    </div>

    <div class="dg-grid-2" style="margin-top:14px">
      <label class="dg-field" style="margin:0"><span class="dg-label">Entry Price</span><input type="number" id="fEntry" class="dg-input" step="any"></label>
      <label class="dg-field" style="margin:0"><span class="dg-label">Stop Loss</span><input type="number" id="fSl" class="dg-input" step="any"></label>
    </div>
    
    <div class="dg-grid-2" style="margin-top:14px">
      <label class="dg-field" style="margin:0"><span class="dg-label">Lot Size</span><input type="number" id="fLot" class="dg-input" step="any" value="0.01"></label>
      <label class="dg-field" style="margin:0"><span class="dg-label">P&L ($)</span><input type="number" id="fPnl" class="dg-input" step="any" placeholder="0.00"></label>
    </div>

    <div style="margin-top:24px">
      <button class="dg-btn dg-btn--primary dg-btn--block" onclick="saveTrade()">Save Trade</button>
    </div>
  </div>
</div>

<script src="pwa.js" defer></script>
<script>
(function(){
  'use strict';

  var settings = {};
  try { settings = JSON.parse(localStorage.getItem('dagbo_settings')) || {}; } catch(e){}
  var enabledPairs = Array.isArray(settings.pairs) ? settings.pairs : ['XAUUSD', 'EURUSD', 'GBPUSD', 'US30', 'BTCUSD'];
  
  var trades = [];
  try { trades = JSON.parse(localStorage.getItem('dagbo_journal')) || []; } catch(e){}

  var currentFilter = 'ALL';
  var editingId = null;

  // --- FORMATTING HELPERS ---
  function fmtMoney(n) {
    var v = Number(n) || 0;
    return (v > 0 ? '+$' : (v < 0 ? '-$' : '$')) + Math.abs(v).toFixed(2);
  }
  function fmtR(n) {
    var v = Number(n) || 0;
    return (v > 0 ? '+' : '') + v.toFixed(1) + 'R';
  }

  // --- RENDER STATS ---
  function renderStats() {
    var closed = trades.filter(function(t){ return t.result === 'WIN' || t.result === 'LOSS'; });
    var wins = closed.filter(function(t){ return t.result === 'WIN'; }).length;
    var totalPnl = trades.reduce(function(sum, t){ return sum + (Number(t.pnl) || 0); }, 0);
    var totalR = closed.reduce(function(sum, t){ return sum + (Number(t.rMultiple) || 0); }, 0);
    var avgR = closed.length ? totalR / closed.length : 0;
    var winRate = closed.length ? Math.round((wins / closed.length) * 100) : null;

    document.getElementById('statTotal').textContent = trades.length;
    
    var wrEl = document.getElementById('statWinRate');
    if (winRate !== null) {
      wrEl.textContent = winRate + '%';
      wrEl.className = 'dg-stat__value ' + (winRate >= 50 ? 'dg-key' : 'dg-neg');
    } else {
      wrEl.textContent = '—';
      wrEl.className = 'dg-stat__value';
    }

    var pnlEl = document.getElementById('statPnl');
    pnlEl.textContent = trades.length ? fmtMoney(totalPnl) : '—';
    pnlEl.className = 'dg-stat__value ' + (totalPnl > 0 ? 'dg-pos' : (totalPnl < 0 ? 'dg-neg' : ''));

    document.getElementById('statRR').textContent = closed.length ? fmtR(avgR) : '—';
  }

  // --- RENDER LIST ---
  function renderList() {
    var list = document.getElementById('tradeList');
    var filtered = trades.slice().reverse().filter(function(t){
      if (currentFilter === 'ALL') return true;
      return t.result === currentFilter;
    });

    if (!filtered.length) {
      list.innerHTML = '<div class="dg-card" style="text-align:center;padding:32px 16px"><p class="dg-muted">No trades found. Add one above!</p></div>';
      return;
    }

    var html = '';
    filtered.forEach(function(t) {
      var isWin = t.result === 'WIN';
      var isLoss = t.result === 'LOSS';
      var isOpen = t.result === 'OPEN';
      
      var badgeClass = isWin ? 'dg-pill--win' : (isLoss ? 'dg-pill--loss' : 'dg-pill--open');
      var badgeText = isWin ? 'Win' : (isLoss ? 'Loss' : 'Open');
      
      var pnlClass = (t.pnl > 0) ? 'dg-pos' : ((t.pnl < 0) ? 'dg-neg' : 'dg-muted');
      
      // Format date
      var d = new Date(t.dateOpened || Date.now());
      var dateStr = d.toLocaleDateString('en-GB', {day:'numeric', month:'short'});

      html += 
        '<div class="dg-card" style="padding:16px;margin-bottom:12px;position:relative" onclick="editTrade(\'' + t.id + '\')">' +
          '<div style="display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:12px">' +
            '<div>' +
              '<div style="font-size:18px;font-weight:700;display:flex;align-items:center;gap:8px">' +
                t.pair + 
                '<span style="font-size:13px;font-weight:600;color:' + (t.direction === 'BUY' ? 'var(--dg-green-ink)' : 'var(--dg-red-ink)') + '">' +
                  (t.direction === 'BUY' ? '↗ Buy' : '↘ Sell') +
                '</span>' +
              '</div>' +
              '<div class="dg-muted" style="font-size:12px;margin-top:2px">' + dateStr + '</div>' +
            '</div>' +
            '<span class="dg-pill ' + badgeClass + '">' + badgeText + '</span>' +
          '</div>' +
          
          '<div style="display:flex;justify-content:space-between;font-size:14px;margin-bottom:6px">' +
            '<span class="dg-muted">Entry: <span style="color:var(--dg-text);font-weight:600">' + (t.entry || '—') + '</span></span>' +
            '<span class="dg-muted">Exit: <span style="color:var(--dg-text);font-weight:600">' + (t.exit || (isOpen ? '—' : '—')) + '</span></span>' +
          '</div>' +
          
          '<div class="' + pnlClass + '" style="font-weight:700;font-size:15px">' +
            (isOpen ? 'Running...' : fmtMoney(t.pnl) + ' (' + fmtR(t.rMultiple) + ')') +
          '</div>' +
          
        '</div>';
    });

    list.innerHTML = html;
  }

  // --- FORM LOGIC ---
  window.openForm = function() {
    editingId = null;
    document.getElementById('formTitle').textContent = 'New Trade';
    
    // Fill pairs
    var sel = document.getElementById('fPair');
    sel.innerHTML = '';
    enabledPairs.forEach(function(p) {
      var opt = document.createElement('option');
      opt.value = p === 'GOLD' ? 'XAUUSD' : p;
      opt.textContent = p;
      sel.appendChild(opt);
    });

    document.getElementById('fEntry').value = '';
    document.getElementById('fSl').value = '';
    document.getElementById('fLot').value = '0.01';
    document.getElementById('fPnl').value = '';
    document.getElementById('fResult').value = 'OPEN';
    document.getElementById('fDir').value = 'BUY';
    
    document.getElementById('tradeModal').style.display = 'flex';
  };

  window.closeForm = function() {
    document.getElementById('tradeModal').style.display = 'none';
  };

  window.editTrade = function(id) {
    var t = trades.filter(function(x){ return x.id === id; })[0];
    if (!t) return;
    
    editingId = id;
    document.getElementById('formTitle').textContent = 'Edit Trade';
    
    var sel = document.getElementById('fPair');
    sel.innerHTML = '';
    enabledPairs.forEach(function(p) {
      var opt = document.createElement('option');
      opt.value = p === 'GOLD' ? 'XAUUSD' : p;
      opt.textContent = p;
      sel.appendChild(opt);
    });
    
    sel.value = t.pair === 'GOLD' ? 'XAUUSD' : t.pair;
    document.getElementById('fDir').value = t.direction;
    document.getElementById('fResult').value = t.result;
    document.getElementById('fEntry').value = t.entry;
    document.getElementById('fSl').value = t.stopLoss;
    document.getElementById('fLot').value = t.lotSize;
    document.getElementById('fPnl').value = t.pnl || '';

    document.getElementById('tradeModal').style.display = 'flex';
  };

  window.saveTrade = function() {
    var pair = document.getElementById('fPair').value;
    var dir = document.getElementById('fDir').value;
    var result = document.getElementById('fResult').value;
    var entry = parseFloat(document.getElementById('fEntry').value);
    var sl = parseFloat(document.getElementById('fSl').value);
    var lot = parseFloat(document.getElementById('fLot').value);
    var pnl = parseFloat(document.getElementById('fPnl').value) || 0;

    if (isNaN(entry) || isNaN(sl) || isNaN(lot)) {
      alert("Please fill in Entry, Stop Loss, and Lot Size.");
      return;
    }

    // Calculate R-Multiple based on risk
    var riskAmount = Number(settings.accountSize) * (Number(settings.risk) || 1) / 100;
    var rMult = result === 'OPEN' ? 0 : (pnl / (riskAmount || 1));

    var newTrade = {
      id: editingId || String(Date.now()),
      pair: pair,
      direction: dir,
      result: result,
      entry: entry,
      stopLoss: sl,
      lotSize: lot,
      pnl: result === 'OPEN' ? 0 : pnl,
      rMultiple: Math.round(rMult * 10) / 10,
      dateOpened: editingId ? (trades.filter(function(x){return x.id===editingId})[0].dateOpened) : new Date().toISOString(),
      dateClosed: result === 'OPEN' ? null : new Date().toISOString()
    };

    if (editingId) {
      trades = trades.map(function(t){ return t.id === editingId ? newTrade : t; });
    } else {
      trades.push(newTrade);
    }

    localStorage.setItem('dagbo_journal', JSON.stringify(trades));
    closeForm();
    renderStats();
    renderList();
  };

  window.filterTrades = function(type) {
    currentFilter = type;
    renderList();
  };

  // INIT
  renderStats();
  renderList();

})();
</script>
</body>
</html>
