/* ═══════════════════════════════════════════════════════════════════════════

var SETTINGS_KEY = 'dagbo_settings';
function readSettings(){ try { return JSON.parse(localStorage.getItem(SETTINGS_KEY)) || {}; } catch(e){ return {}; } }
function getName(){ var s = readSettings(); return (s.name || 'Oga').replace(/^Oga\s+/i, ''); }
function getAutoRead(){ return readSettings().autoRead === true; }
function getRiskPct(){ return Number(readSettings().risk) || 1; }
function getAccount(){ return Number(readSettings().accountSize) || 100; }
function getGroqKey(){ return (readSettings().groqKey || '').trim(); }
function hasGroqKey(){ return getGroqKey().length > 10; }

/* DATE ENGINE */
var NFP_EXCEPTIONS = { '2013-10':'2013-10-22', '2025-01':'2025-01-10', '2026-01':'2026-01-09' };
function firstFriday(year, mIdx){ var d = new Date(year, mIdx, 1); var offset = (5 - d.getDay() + 7) % 7; return new Date(year, mIdx, 1 + offset); }
function nfpDatesForYear(year){ var out = []; for (var m = 0; m < 12; m++){ var key = year + '-' + String(m + 1).padStart(2, '0'); if (NFP_EXCEPTIONS[key]){ var p = NFP_EXCEPTIONS[key].split('-'); out.push(new Date(parseInt(p[0],10), parseInt(p[1],10) - 1, parseInt(p[2],10))); } else { out.push(firstFriday(year, m)); } } return out; }
function fmtDateObj(d){ return ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'][d.getDay()] + ', ' + ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'][d.getMonth()] + ' ' + d.getDate() + ', ' + d.getFullYear(); }
var FOMC_DATES = { 2019:['01-30','03-20','05-01','06-19','07-31','09-18','10-30','12-11'],2020:['01-29','03-03','03-15','04-29','06-10','07-29','09-16','11-05','12-16'],2021:['01-27','03-17','04-28','06-16','07-28','09-22','11-03','12-15'],2022:['01-26','03-16','05-04','06-15','07-27','09-21','11-02','12-14'],2023:['02-01','03-22','05-03','06-14','07-26','09-20','11-01','12-13'],2024:['01-31','03-20','05-01','06-12','07-31','09-18','11-07','12-18'],2025:['01-29','03-19','05-07','06-18','07-30','09-17','10-29','12-10'],2026:['01-28','03-18','04-29','06-17','07-29','09-16','11-04','12-16'] };
var CPI_DATES = { 2023:['01-12','02-14','03-14','04-12','05-10','06-13','07-12','08-10','09-13','10-12','11-14','12-12'],2024:['01-11','02-13','03-12','04-10','05-15','06-12','07-11','08-14','09-11','10-10','11-13','12-11'],2025:['01-15','02-12','03-12','04-10','05-13','06-11','07-15','08-12','09-10','10-15','11-12','12-10'],2026:['01-14','02-11','03-11','04-14','05-12','06-10','07-14','08-11','09-09','10-14','11-11','12-09'] };
function tryDate(q, e){ var t = q.toLowerCase(), today = new Date(), yr = e.year; if (/nfp|non-?farm|jobs report/.test(t)){ if (/next|upcoming|coming/.test(t)){ var found = null; for (var y = today.getFullYear(); y <= today.getFullYear() + 1 && !found; y++){ var ds = nfpDatesForYear(y); for (var i = 0; i < ds.length; i++){ if (ds[i] > today){ found = ds[i]; break; } } } if (found) return 'Oga, the <b>next NFP</b> na <b>' + fmtDateObj(found) + '</b> · 1:30pm Naija.<br><br><b>Dagbo Rule:</b> No trade 30 min before/after.'; return 'Oga, check <b>forexfactory.com</b>.'; } if (yr && yr >= 2008 && yr <= 2026){ return '<b>NFP dates for ' + yr + ':</b><br>' + nfpDatesForYear(yr).map(function(d){ return '• ' + fmtDateObj(d); }).join('<br>'); } return '<b>NFP</b> = First Friday, 1:30pm Naija.<br>Ask "Next NFP".'; } if (/fomc|fed|interest rate/.test(t)){ if (yr && FOMC_DATES[yr]){ return '<b>FOMC dates for ' + yr + ':</b><br>' + FOMC_DATES[yr].map(function(d){ var p = d.split('-'); return '• ' + fmtDateObj(new Date(yr, parseInt(p[0],10)-1, parseInt(p[1],10))); }).join('<br>'); } return '<b>FOMC</b> = 8×/year, 7pm Naija.<br>Ask "FOMC 2024".'; } if (/cpi|inflation/.test(t)){ if (yr && CPI_DATES[yr]){ return '<b>CPI dates for ' + yr + ':</b><br>' + CPI_DATES[yr].map(function(d){ var p = d.split('-'); return '• ' + fmtDateObj(new Date(yr, parseInt(p[0],10)-1, parseInt(p[1],10))); }).join('<br>'); } return '<b>CPI</b> = Mid-month, 1:30pm Naija.<br>Ask "CPI 2024".'; } return null; }

/* MATH ENGINE */
function tryMath(q, e){ var t = q.toLowerCase(), acc = e.amount || getAccount(), risk = e.percent !== null ? e.percent : getRiskPct(); if (/(risk|percent|%|loss)/.test(t) && (e.percent !== null || e.amount !== null)){ return 'Oga, <b>Risk math:</b><br>Account: $' + acc.toLocaleString() + '<br>Risk: ' + risk + '%<br><b>Risk amount: $' + (acc * risk / 100).toFixed(2) + '</b><br><br>Formula: <b>Risk $ = Account × Risk% ÷ 100</b>'; } if (/lot/.test(t) && /pip/.test(t)){ return '<b>Pip value:</b><br>• 0.01 lot = $0.10/pip<br>• 0.10 lot = $1.00/pip<br><b>GOLD 0.01 lot:</b> $0.01 per 0.10 move'; } if (/(position size|how many lot|what lot|which lot)/.test(t)){ var slPips = e.numbers.length ? e.numbers[0] : 20; var riskAmt = acc * risk / 100; return '<b>Position size:</b><br>Account: $' + acc + '<br>Risk: ' + risk + '% = $' + riskAmt.toFixed(2) + '<br>SL: ' + slPips + ' pips<br><b>Lot: ' + (riskAmt / (slPips * 10)).toFixed(2) + '</b><br><br><b>Dagbo Rule:</b> If < 0.01, skip trade.'; } return null; }

/* MATCHER */
var STOPWORDS = new Set(['the','a','an','is','are','was','were','be','been','being','of','in','on','at','to','for','with','about','by','as','from','that','this','these','those','it','its']);
var KEYWORD_CACHE = null;
function normalizeText(s){ return typeof s === 'string' ? s.toLowerCase().replace(/[^a-z0-9\s]/g, ' ').replace(/\s+/g, ' ').trim() : ''; }
function buildKeywordCache(kb){
  var entries = [];
  for (var i = 0; i < kb.length; i++){
    var rawKws = kb[i].k || [], kws = [];
    for (var j = 0; j < rawKws.length; j++){
      var norm = normalizeText(rawKws[j]); if (!norm) continue;
      kws.push({ text: norm, words: norm.split(' '), len: norm.length });
    }
    entries.push({ idx: i, keywords: kws, maxScore: 100 });
  }
  return { entries: entries };
}
function matchKB(q){
  if (!KEYWORD_CACHE) KEYWORD_CACHE = buildKeywordCache(KB);
  var qNorm = normalizeText(q); if (!qNorm) return [];
  var words = qNorm.split(' ').filter(function(w){ return !STOPWORDS.has(w); });
  var rawByIdx = Object.create(null);
  for (var i = 0; i < KEYWORD_CACHE.entries.length; i++){
    var ent = KEYWORD_CACHE.entries[i], total = 0;
    for (var j = 0; j < ent.keywords.length; j++){
      var kw = ent.keywords[j], pos = -1;
      for (var k = 0; k <= words.length - kw.words.length; k++){
        var ok = true; for (var m = 0; m < kw.words.length; m++){ if (words[k+m] !== kw.words[m]){ ok = false; break; } }
        if (ok){ pos = k; break; }
      }
      if (pos > -1) total += (kw.len * 2) + 10;
    }
    if (total > 0) rawByIdx[ent.idx] = Math.min(100, total);
  }
  var results = [];
  for (var ei = 0; ei < KEYWORD_CACHE.entries.length; ei++){
    if (rawByIdx[ei]) results.push({ idx: ei, score: rawByIdx[ei] });
  }
  results.sort(function(a, b){ return b.score - a.score; });
  return results;
}

/* COMPOSER & GROQ */
function compose(userQ){
  var raw = String(userQ).trim(), low = raw.toLowerCase();
  if (/\b(current|live|price)\b/i.test(low)) return "I no dey give live price. Open the Chart page to see real price from TradingView.";
  if (/\b(should|can|make)\b i (buy|sell)\b/i.test(low)) return "I no dey give trade calls, I only teach. Check the Chart page.";
  
  var e = { numbers: raw.match(/\d+(?:\.\d+)?/g) || [], amount: null, percent: null, year: null };
  var am = raw.match(/\$\s?([\d,]+(?:\.\d+)?)/); if (am) e.amount = parseFloat(am[1].replace(/,/g,''));
  var pc = raw.match(/([\d.]+)\s?%/); if (pc) e.percent = parseFloat(pc[1]);
  var yr = raw.match(/\b(20\d{2})\b/); if (yr) e.year = parseInt(yr[1],10);

  var m = tryMath(raw, e); if (m) return m;
  var d = tryDate(raw, e); if (d) return d;

  var results = matchKB(raw);
  if (results.length > 0 && results[0].score >= 30) return KB[results[0].idx].a;

  if (hasGroqKey()) return { type: 'groq', query: raw };
  return "I no get correct answer for that inside my notes.<br><br>Option 1: rephrase am short.<br>Option 2: add a Groq key in Settings.";
}

function askGroq(userQ){
  return new Promise(function(resolve, reject){
    var key = getGroqKey(); if (!key) return reject(new Error('No key'));
    var sys = 'You are Dagbo Brain, a trading teacher for ' + getName() + '. Speak in Pidgin English. Never give live prices or trade calls. Answer in 3-6 sentences. Use <b>bold</b> for key terms.';
    var xhr = new XMLHttpRequest();
    xhr.open('POST', 'https://api.groq.com/openai/v1/chat/completions', true);
    xhr.setRequestHeader('Content-Type', 'application/json');
    xhr.setRequestHeader('Authorization', 'Bearer ' + key);
    xhr.onload = function(){
      if (xhr.status === 200) {
        var data = JSON.parse(xhr.responseText);
        var ans = data.choices[0].message.content.replace(/\*\*(.+?)\*\*/g, '<b>$1</b>').replace(/\n/g, '<br>');
        resolve(ans);
      } else { reject(new Error('Groq error ' + xhr.status)); }
    };
    xhr.onerror = function(){ reject(new Error('Network error')); };
    xhr.send(JSON.stringify({ model: 'llama-3.3-70b-versatile', messages: [{ role: 'system', content: sys }, { role: 'user', content: userQ }], temperature: 0.4, max_tokens: 400 }));
  });
}

/* UI WIRING */
var chatArea = document.getElementById('chatArea');
var chatInput = document.getElementById('chatInput');
var _hist = [];
var _rec = null;

function addMessage(role, text) {
  var d = document.createElement('div');
  d.className = 'chat-bubble ' + role;
  var html = String(text).replace(/\n/g, '<br>').replace(/\*\*(.+?)\*\*/g, '<b>$1</b>');
  var time = new Date().toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'});
  d.innerHTML = html + '<span class="chat-time">' + time + '</span>';
  chatArea.appendChild(d);
  window.scrollTo({ top: document.body.scrollHeight, behavior: 'smooth' });
  if (role === 'ai' || role === 'me') _hist.push({ role: role, text: text });
}

function sendMessage() {
  var text = chatInput.value.trim();
  if (!text) return;
  chatInput.value = '';
  addMessage('me', text);
  
  var typing = document.createElement('div');
  typing.className = 'chat-bubble ai';
  typing.innerHTML = '...';
  chatArea.appendChild(typing);
  window.scrollTo({ top: document.body.scrollHeight, behavior: 'smooth' });

  setTimeout(function() {
    chatArea.removeChild(typing);
    var reply = compose(text);
    if (reply && reply.type === 'groq') {
      askGroq(reply.query).then(function(ans) {
        addMessage('ai', ans);
        if (getAutoRead()) speak(ans);
      }).catch(function(err) {
        addMessage('ai', 'Error: ' + err.message);
      });
    } else {
      addMessage('ai', reply);
      if (getAutoRead()) speak(reply);
    }
  }, 600);
}

function handleEnter(e) { if (e.key === 'Enter') sendMessage(); }
function askQuestion(q) { chatInput.value = q; sendMessage(); }

function speak(text) {
  try {
    var clean = String(text).replace(/<[^>]*>/g, ' ');
    var u = new SpeechSynthesisUtterance(clean);
    u.lang = 'en-NG'; u.rate = 0.95;
    speechSynthesis.cancel();
    speechSynthesis.speak(u);
  } catch(e){}
}

function startVoice() {
  var SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SR) { alert("Voice not supported on this browser."); return; }
  if (_rec) { _rec.stop(); return; }
  _rec = new SR();
  _rec.lang = 'en-NG'; _rec.interimResults = false;
  _rec.onstart = function() { chatInput.placeholder = "Listening..."; };
  _rec.onend = function() { chatInput.placeholder = "Type your message..."; _rec = null; };
  _rec.onresult = function(e) { chatInput.value = e.results[0][0].transcript; sendMessage(); };
  _rec.start();
}

function toggleAutoRead(el) {
  var s = readSettings();
  s.autoRead = el.checked;
  localStorage.setItem(SETTINGS_KEY, JSON.stringify(s));
}

(function boot() {
  document.getElementById('tgAutoRead').checked = getAutoRead();
  var name = getName();
  addMessage('ai', "Hello " + name + "! 👋<br>I'm Dagbo AI. How can I help you today?<br><br>✅ Explain any signal<br>✅ Teach trading concepts<br>✅ Answer your questions");
})();
</script>
